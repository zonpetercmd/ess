<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Employee Self Services</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Firebase Config -->
    <script src="config/firebase-config.js"></script>
</head>
<body>

    <div class="login-screen">
        <div class="login-card">
            <!-- Agar aapke paas logo hai, to is img tag ko uncomment karein -->
            <!-- <img src="logo.png" style="max-height: 60px; margin-bottom: 15px;" onerror="this.style.display='none'"> -->
            
            <h2>Staff Portal</h2>
            <p>Login to view your Salary & Pay Slips</p>
            
            <div id="error_msg" style="color: #ef4444; font-size: 13px; margin-bottom: 15px; display: none; font-weight: 600;"></div>

            <input type="email" id="email" placeholder="Email Address" autocomplete="username">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            
            <button id="loginBtn" class="btn-login">Login</button>
        </div>
    </div>

    <!-- Login Logic -->
    <script src="js/auth.js"></script>
</body>
</html>
