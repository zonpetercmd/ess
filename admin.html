<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Employee Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h2 style="font-size: 20px;">Admin Portal</h2>
        <a href="index.html" style="text-decoration: none; color: #ef4444; font-weight: 600;">Back to Login</a>
    </header>

    <div class="container">
        <!-- Add Employee -->
        <div class="card">
            <h3>➕ Add New Employee</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                <input type="text" id="emp_name" placeholder="Full Name" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <input type="email" id="emp_email" placeholder="Email ID" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <input type="text" id="emp_pass" placeholder="Login Password" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <input type="text" id="emp_desig" placeholder="Designation (e.g., Teacher)" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <input type="number" id="emp_basic" placeholder="Basic Salary (₹)" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <button onclick="addEmployee()" class="btn-login" style="padding:10px;">Create Employee</button>
            </div>
        </div>

        <!-- Generate Salary -->
        <div class="card">
            <h3>💰 Generate Salary</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                <select id="sal_emp" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                    <option value="">Select Employee</option>
                </select>
                <input type="month" id="sal_month" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <input type="number" id="sal_allowance" placeholder="Allowances (+)" value="0" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <input type="number" id="sal_deduct" placeholder="Deductions (-)" value="0" style="padding:10px; border:1px solid #ccc; border-radius:8px;">
                <button onclick="generateSalary()" class="btn-login" style="padding:10px; background: #2563eb;">Save Salary</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="config/firebase-config.js"></script>
    
    <script>
        // Initialize Firebase
        if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
        const db = firebase.database();

        // ✅ 1. Check if Admin is Logged In (Token Verification)
        const token = localStorage.getItem('staff_token');
        if (!token) {
            alert("❌ Access Denied! Please login first.");
            window.location.href = 'index.html'; // Redirect to login page
        }

        // 2. Load employees for dropdown (Auto updates when new employee added)
        db.ref('employees').on('value', (snapshot) => {
            const data = snapshot.val();
            const select = document.getElementById('sal_emp');
            select.innerHTML = '<option value="">Select Employee</option>';
            if (data) {
                Object.keys(data).forEach(key => {
                    select.innerHTML += `<option value="${data[key].uid}">${data[key].name} - ₹${data[key].basicSalary}</option>`;
                });
            }
        });

        // 3. Add Employee Function
        async function addEmployee() {
            const name = document.getElementById('emp_name').value;
            const email = document.getElementById('emp_email').value;
            const pass = document.getElementById('emp_pass').value;
            const desig = document.getElementById('emp_desig').value;
            const basic = document.getElementById('emp_basic').value;

            if (!name || !email || !pass || !basic) {
                return alert("⚠️ Please fill all required fields.");
            }

            try {
                // ✅ API Call with Authorization Token
                const res = await fetch('/api/create-employee', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token // Sending token to verify admin
                    },
                    body: JSON.stringify({ name, email, password: pass, designation: desig, basicSalary: basic })
                });
                
                const result = await res.json();
                
                if (!res.ok) throw new Error(result.error || 'Failed to create employee');
                
                alert("✅ Employee Added Successfully");
                
                // Clear inputs
                document.getElementById('emp_name').value = '';
                document.getElementById('emp_email').value = '';
                document.getElementById('emp_pass').value = '';
                document.getElementById('emp_desig').value = '';
                document.getElementById('emp_basic').value = '';
                
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        }

        // 4. Generate Salary Function
        async function generateSalary() {
            const uid = document.getElementById('sal_emp').value;
            const month = document.getElementById('sal_month').value;
            const allowance = parseFloat(document.getElementById('sal_allowance').value) || 0;
            const deduct = parseFloat(document.getElementById('sal_deduct').value) || 0;

            if (!uid || !month) return alert("⚠️ Please select an employee and month.");

            try {
                // Fetch basic salary of selected employee
                const snap = await db.ref('employees').once('value');
                let basic = 0;
                snap.forEach(child => { 
                    if(child.val().uid === uid) basic = child.val().basicSalary; 
                });
                
                const net = basic + allowance - deduct;
                
                // Save to Firebase
                await db.ref(`salary_records/${uid}/${month}`).set({
                    month: month, 
                    basic: basic, 
                    allowances: allowance, 
                    deductions: deduct, 
                    netSalary: net, 
                    status: 'Paid'
                });
                
                alert("✅ Salary Generated Successfully!");
                
                // Clear inputs
                document.getElementById('sal_allowance').value = '0';
                document.getElementById('sal_deduct').value = '0';
                
            } catch (err) {
                alert("❌ Firebase Error: " + err.message);
            }
        }
    </script>
</body>
</html>
