<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - ESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; margin-bottom: 5px; color: #64748b; font-weight: 600; }
        .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header style="background: #111827; color: white; padding: 15px 5%;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <h2 style="font-weight: 800; font-size: 20px; margin: 0;">Admin Portal</h2>
            <span style="background: #374151; padding: 4px 10px; border-radius: 6px; font-size: 12px;">HRMS</span>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="admin_name" style="font-weight: 600; font-size: 14px;">Loading...</span>
            <button onclick="logout()" class="btn-action" style="background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;">Logout</button>
        </div>
    </header>

    <div class="container" style="margin-top: 30px;">
        
        <!-- STATS ROW -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="display: flex; align-items: center; gap: 15px; padding: 20px; border-left: 5px solid #2563eb;">
                <div style="background: #dbeafe; color: #2563eb; padding: 15px; border-radius: 50%; font-size: 24px;"><i class="fas fa-users"></i></div>
                <div>
                    <h4 style="margin: 0; color: #64748b; font-size: 13px;">Total Employees</h4>
                    <h2 style="margin: 0; font-size: 24px;" id="total_emp">0</h2>
                </div>
            </div>
            <div class="card" style="display: flex; align-items: center; gap: 15px; padding: 20px; border-left: 5px solid #10b981;">
                <div style="background: #d1fae5; color: #10b981; padding: 15px; border-radius: 50%; font-size: 24px;"><i class="fas fa-user-check"></i></div>
                <div>
                    <h4 style="margin: 0; color: #64748b; font-size: 13px;">Approved</h4>
                    <h2 style="margin: 0; font-size: 24px;" id="approved_emp">0</h2>
                </div>
            </div>
            <div class="card" style="display: flex; align-items: center; gap: 15px; padding: 20px; border-left: 5px solid #f59e0b;">
                <div style="background: #fef3c7; color: #f59e0b; padding: 15px; border-radius: 50%; font-size: 24px;"><i class="fas fa-clock"></i></div>
                <div>
                    <h4 style="margin: 0; color: #64748b; font-size: 13px;">Pending Requests</h4>
                    <h2 style="margin: 0; font-size: 24px;" id="pending_emp">0</h2>
                </div>
            </div>
        </div>

        <!-- ADD EMPLOYEE FORM -->
        <div class="card">
            <h3 style="margin-bottom: 20px; font-weight: 800;"><i class="fas fa-user-plus" style="color: #2563eb;"></i> Add New Employee</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <input type="text" id="emp_name" placeholder="Full Name" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <input type="email" id="emp_email" placeholder="Email Address" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <input type="text" id="emp_pass" placeholder="Login Password" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <input type="text" id="emp_code" placeholder="Employee Code (e.g., EMP001)" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <input type="text" id="emp_desig" placeholder="Designation (e.g., Teacher)" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <input type="number" id="emp_basic" placeholder="Basic Salary (₹)" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <select id="emp_role" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                    <option value="Employee">Role: Employee</option>
                    <option value="Manager">Role: Manager / HR</option>
                    <option value="Admin">Role: Admin</option>
                </select>
            </div>
            <button onclick="addEmployee()" class="btn-login" style="margin-top: 20px; width: auto; padding: 12px 30px; background: #2563eb;">
                <i class="fas fa-check"></i> Create Employee
            </button>
        </div>

        <!-- GENERATE SALARY FORM -->
        <div class="card">
            <h3 style="margin-bottom: 20px; font-weight: 800;"><i class="fas fa-money-check-alt" style="color: #10b981;"></i> Generate Monthly Salary</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <select id="sal_emp_id" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                    <option value="">Select Employee</option>
                </select>
                <input type="month" id="sal_month" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <input type="number" id="sal_allowance" placeholder="Allowances (+)" value="0" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <input type="number" id="sal_deduct" placeholder="Deductions (-)" value="0" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                <select id="sal_status" style="padding:12px; border:1px solid #ccc; border-radius:8px;">
                    <option value="Paid">Status: Paid / Credited</option>
                    <option value="Pending">Status: Pending</option>
                </select>
            </div>
            <button onclick="generateSalary()" class="btn-login" style="margin-top: 20px; width: auto; padding: 12px 30px; background: #10b981;">
                <i class="fas fa-check"></i> Generate Salary
            </button>
        </div>

        <!-- EMPLOYEE LIST -->
        <div class="card">
            <h3 style="margin-bottom: 20px; font-weight: 800;"><i class="fas fa-list" style="color: #2563eb;"></i> Employee Directory</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="employee_list">
                        <tr><td colspan="6" style="text-align: center; color: #999;">Loading employees...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- EDIT EMPLOYEE MODAL (For Salary Structure) -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; font-weight: 800;">Edit Employee & Salary Structure</h3>
            <input type="hidden" id="edit_uid">
            
            <div class="form-grid">
                <div class="form-group"><label>Employee Code</label><input type="text" id="edit_code"></div>
                <div class="form-group"><label>Designation</label><input type="text" id="edit_desig"></div>
                
                <div class="form-group"><label>Basic Pay (₹)</label><input type="number" id="edit_basic"></div>
                <div class="form-group"><label>HRA (₹)</label><input type="number" id="edit_hra"></div>
                <div class="form-group"><label>Conveyance (₹)</label><input type="number" id="edit_conveyance"></div>
                <div class="form-group"><label>Special Allowance (₹)</label><input type="number" id="edit_special"></div>
                <div class="form-group"><label>PF Deduction (₹)</label><input type="number" id="edit_pf"></div>
                <div class="form-group"><label>ESIC Deduction (₹)</label><input type="number" id="edit_esic"></div>
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="saveSalaryStructure()" class="btn-login" style="width: auto; padding: 10px 20px; background: #2563eb;">Save Changes</button>
                <button onclick="closeModal()" class="btn-action" style="background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="config/firebase-config.js"></script>
    
    <script src="js/admin.js"></script>
</body>
</html>
